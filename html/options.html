<!DOCTYPE html> 
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Memory - Opcions</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script src="../js/options.js" type="module"></script>
	<link rel="icon" type="image/svg+xml" href="../resources/back.svg">
</head>
<body>
    <h1 id="title">Opcions</h1>

    <div id="options-container" class="center" style="flex-direction: column; max-width: 400px;">
        
        <label for="numCards">Número de cartes diferents:</label>
        <input type="number" id="numCards" value="4" min="2" max="10">

        <label for="groupSize">Mida dels grups:</label>
        <select id="groupSize">
            <option value="2" selected>Parelles</option>
            <option value="3">Trios</option>
            <option value="4">Quartets</option>
        </select>

        <label for="dif">Dificultat:</label>
        <select id="dif">
            <option value="easy">Baixa (Fàcil)</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Alta (Difícil)</option>
        </select>

        <label for="mode">Mode de joc:</label>
        <select id="mode">
            <option value="1">Mode 1: Partida Única</option>
            <option value="2">Mode 2: Progressiu</option>
        </select>

        <label for="startLevel">Nivell inicial (Mode 2):</label>
        <input type="number" id="startLevel" value="1" min="1" max="10">

        <br>
        <button id="default" class="center" style="width: 12rem; height: 3rem; font-size: 1.2rem;">Per defecte</button>
        <button id="apply" class="center" style="width: 12rem; height: 3rem; font-size: 1.2rem;">Aplicar i Tornar</button>
    </div>
</body>
</html>
